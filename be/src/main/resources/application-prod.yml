# Production / staging: API docs are disabled (README §8) and cookies must be Secure.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

beestore:
  security:
    cookie-secure: ${COOKIE_SECURE:true}

# Real SMTP providers (Resend / Brevo / SES) need authentication and STARTTLS on port 587.
spring:
  mail:
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
