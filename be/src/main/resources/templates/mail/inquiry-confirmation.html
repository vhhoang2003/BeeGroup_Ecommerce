<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: 0 auto;">
<p th:text="#{mail.greeting(${name})}">Hello</p>
<p th:text="#{mail.inquiry-confirmation.body}">Body</p>
<p><strong th:text="#{mail.inquiry-confirmation.code}">Code</strong>: <span th:text="${code}">INQ</span></p>
<p th:if="${productName}"><strong th:text="#{mail.inquiry-confirmation.product}">Product</strong>:
  <span th:text="${productName}">Product</span> &times; <span th:text="${quantity}">1</span></p>
<p style="font-size: 12px; color: #888;" th:text="#{mail.footer}">Footer</p>
</body>
</html>
