<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: 0 auto;">
<p th:text="#{mail.greeting(${name})}">Hello</p>
<p th:text="#{mail.reset-password.body}">Body</p>
<p><a th:href="${link}" style="display: inline-block; background: #008ECC; color: #fff; padding: 10px 20px; border-radius: 999px; text-decoration: none;" th:text="#{mail.reset-password.button}">Open</a></p>
<p style="font-size: 12px; color: #666;" th:text="${link}">link</p>
<p style="font-size: 12px; color: #666;" th:text="#{mail.ignore}">Ignore</p>
<p style="font-size: 12px; color: #888;" th:text="#{mail.footer}">Footer</p>
</body>
</html>
