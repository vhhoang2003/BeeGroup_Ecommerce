# Production stack for one Debian server behind Cloudflare Tunnel (README §12.6, Decision Log D-14 / D-15).
#
#   Cloudflare -> tunnel (cloudflared) -> proxy:80 (Caddy) -> /api, /uploads -> api
#                                                         -> everything else -> web
#
# Nothing is published on public interfaces: TLS terminates at Cloudflare, the database is internal only, and the
# proxy is additionally bound to 127.0.0.1:${PROXY_PORT} for health checks from the server itself.
# Resource limits keep the whole stack around 1.7 GB RAM and 3.5 CPU on a shared machine.
#
# Usage (from /opt/beestore):
#   infra/scripts/update.sh   pull the images CD published to GHCR and restart (also run by cron every 5 minutes)
#   infra/scripts/deploy.sh   build the images on this server instead (fallback)
name: beestore

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-beestore}
      POSTGRES_USER: ${DB_USER:-beestore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Small-footprint tuning: 20 products and low traffic do not need more.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beestore} -d ${DB_NAME:-beestore}"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    logging: *logging

  api:
    # Published by .github/workflows/cd.yml and pulled by infra/scripts/update.sh; `build` stays for manual builds.
    image: ${API_IMAGE:-ghcr.io/vhhoang2003/beestore-api}:${IMAGE_TAG:-main}
    build: ./be
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-beestore}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/uploads
      CATALOG_SOURCE_PATH: /data/product
      PUBLIC_ASSET_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}/uploads
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      # Next.js on-demand revalidation after admin edits (README §6.7), over the internal network.
      REVALIDATE_URL: ${REVALIDATE_URL:-http://web:3000/api/revalidate}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      # Serial GC has the smallest footprint for a single small heap.
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -Xss512k
    volumes:
      - ./product:/data/product:ro
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      start_period: 60s
      retries: 8
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    logging: *logging

  web:
    build:
      context: ./fe
      args:
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: ${WEB_IMAGE:-ghcr.io/vhhoang2003/beestore-web}:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      # Server components (SSR / ISR, sitemap) call the API over the Docker network.
      INTERNAL_API_URL: http://api:8080/api/v1
      # Optional: without it admin edits reach the public pages through ISR within 5 minutes instead of at once.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Hero banner photos are still served from ./product under /storage.
      CATALOG_SOURCE_DIR: /data/product
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - ./product:/data/product:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # Loopback only: reachable by cloudflared on this host, never from the internet directly.
    ports:
      - "127.0.0.1:${PROXY_PORT:-8088}:80"
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    logging: *logging

  # Cloudflare Tunnel connector. In the Cloudflare dashboard the public hostname must point to
  # HTTP  proxy:80  (the Caddy service on this Compose network), not to localhost.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - proxy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    logging: *logging

volumes:
  pgdata:
  uploads:
