# README §13.3: checks on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'fe/**'
              - 'product/**'
              - '.github/workflows/**'
            backend:
              - 'be/**'
              - 'product/**'
              - '.github/workflows/**'

  frontend:
    name: Frontend (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      # PageProps / RouteContext are global types that Next.js generates; tsc needs them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend (Spotless, unit + Testcontainers tests, coverage)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            be/target/surefire-reports/
            be/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security (secrets, vulnerable dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned scanner images instead of third-party actions (an action tag used here was withdrawn upstream).
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact
      # Trivy's vulnerability DB is republished every ~6 hours; keying the cache on that window avoids downloading it
      # on every run while keeping it fresh.
      - name: Trivy DB cache window
        id: trivy-window
        run: echo "key=$(date -u +%Y%m%d)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-window.outputs.key }}
          restore-keys: trivy-db-
      - name: Dependency scan (Trivy, HIGH/CRITICAL with a fix available)
        run: >
          mkdir -p ~/.cache/trivy &&
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -v "$HOME/.cache/trivy:/cache"
          aquasec/trivy:0.57.1 --cache-dir /cache
          fs /repo --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet
